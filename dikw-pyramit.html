<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIKW Sorting Quest</title>
<style>
  body { margin:0; background:#0b1026; color:white; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; height:100vh; overflow:hidden; }
  #game-container { width:100%; max-width:500px; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .btn { padding:15px 30px; margin:10px; cursor:pointer; background:#38bdf8; border:none; border-radius:10px; font-size:18px; font-weight:bold; }
  #ar-canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1; opacity:0.3; }
</style>
</head>
<body>

<video id="webcam" playsinline style="display:none;"></video>
<canvas id="ar-canvas"></canvas>

<div id="game-container">
  <h1>ภารกิจพิชิตพีระมิด DIKW</h1>
  <button class="btn" id="btn-ar">เริ่มเล่นโหมด AR</button>
  <button class="btn" id="btn-mouse">เริ่มเล่นโหมดเมาส์/สัมผัส</button>
  <div id="status" style="margin-top:20px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const statusDiv = document.getElementById('status');
let hands = null;

// 1. ระบบโหลด MediaPipe แบบปลอดภัย
async function initMediaPipe() {
  try {
    statusDiv.innerText = "กำลังโหลดระบบ AR...";
    hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(results => {
      // ตรงนี้ใส่ logic วาดและตรวจจับ
    });
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

// 2. ระบบจัดการกล้องที่รองรับทุก Browser
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('webcam');
    video.srcObject = stream;
    await video.play();
    
    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640, height: 480
    });
    camera.start();
    return true;
  } catch (err) {
    alert("ไม่สามารถเข้าถึงกล้องได้: " + err.message);
    return false;
  }
}

// 3. ตัวเริ่มเกม (แก้บั๊กกดแล้วไม่ไป)
document.getElementById('btn-ar').onclick = async () => {
  statusDiv.innerText = "เตรียมเปิดกล้อง...";
  const loaded = await initMediaPipe();
  if (loaded) {
    const camStarted = await startCamera();
    if(camStarted) {
      statusDiv.innerText = "AR เริ่มต้นแล้ว!";
      // ต่อไปคือฟังก์ชันเข้าสู่เกมหลัก
    }
  }
};

document.getElementById('btn-mouse').onclick = () => {
  statusDiv.innerText = "เริ่มโหมดปกติ...";
  // logic เริ่มเกมปกติ
};
</script>
</body>
</html>
